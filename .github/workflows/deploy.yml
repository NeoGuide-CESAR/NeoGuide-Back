name: Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite disparar o deploy manualmente pela interface do GitHub

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw clean test -B

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Localiza o diretório do projeto na VPS
            if [ -d "$HOME/neoguide-back" ]; then
              cd "$HOME/neoguide-back"
            elif [ -d "$HOME/NeoGuide-Back" ]; then
              cd "$HOME/NeoGuide-Back"
            else
              echo "Erro: Diretório do projeto não encontrado na home do usuário!"
              exit 1
            fi

            echo "=== Atualizando repositório na VPS ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Subindo containers com Docker Compose ==="
            docker compose down
            docker compose up -d --build --remove-orphans

            echo "=== Limpando imagens antigas sem uso ==="
            docker image prune -f

            echo "=== Deploy finalizado com sucesso! ==="
