spring:
  application:
    name: neoguide
  # Ambiente: variável SPRING_PROFILES_ACTIVE (dev ou prod). Sem ela, vale dev.
  # Datasource, JPA, JWT e CORS ficam em application-dev.yaml e application-prod.yaml.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: false
    show-sql: false
  # Padrão para qualquer perfil (inclusive testes); em prod o application-prod.yaml exige a variável, sem padrão.
  configuration:
    host-front-end: ${HOST_FRONT_END:http://localhost:4200}

# Documento oficial das normas (página Normas técnicas). Vazio = a tela orienta a buscar no site da Neoenergia.
# Só use o arquivo do back se o grupo tiver autorização para distribuir o PDF.
neoguide:
  normas:
    dis-nor-053:
      url: ${NEOGUIDE_NORMA_053_URL:}
    dis-nor-030:
      url: ${NEOGUIDE_NORMA_030_URL:}

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,normativeCatalog
          show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
