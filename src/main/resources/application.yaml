spring:
  application:
    name: neoguide
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neoguide_db}
    username: ${SPRING_DATASOURCE_USERNAME:neoguide_user}
    password: ${SPRING_DATASOURCE_PASSWORD:neoguide_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      format_sql: false
    show-sql: false
  configuration:
    host-front-end: ${HOST_FRONT_END:http://localhost:4200}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:neoguide-super-secret-key-for-jwt-token-hmac-sha256-minimum-32-bytes}
    expiration: ${SECURITY_JWT_EXPIRATION:86400000}
