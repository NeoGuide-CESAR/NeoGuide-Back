spring:
  application:
    name: neoguide
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: username
    password: password
  configuration:
    host-front-end: http://localhost:4200
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret: "neoguide-super-secret-key-for-jwt-token-hmac-sha256-minimum-32-bytes"
    expiration: 86400000
